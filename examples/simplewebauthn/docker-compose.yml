services:
  simplewebauthn-pqc:
    build: .
    image: yubination-simplewebauthn:14.0.3
    ports:
      # Keep host/container ports and PORT identical, or configure ORIGIN explicitly.
      - "127.0.0.1:8010:8010"
    environment:
      PORT: "8010"
      # WebAuthn treats http://localhost as a secure context, so no TLS is needed
      # as long as you browse to the server on this machine.
      RP_ID: localhost
      AUTHENTICATOR_ATTACHMENT: ""
      USER_VERIFICATION: required
      # ORIGIN: http://localhost:8010        # override if reaching the server by another name
      # RP_NAME: SimpleWebAuthn PQC Example

      # COSE algorithm IDs, most preferred first. Defaults to ML-DSA-44, ML-DSA-65,
      # ML-DSA-87, EdDSA, ES256, RS256. Set to "-7" to force a classical credential
      # for an A/B comparison against the PQC one.
      # ALGORITHMS: "-48,-49,-50,-8,-7,-257"   # or "-50" to demand ML-DSA-87 with no fallback

      # AUTHENTICATOR_ATTACHMENT: cross-platform   # "" to let the browser offer passkeys too
      # RESIDENT_KEY: discouraged                  # "required" for a discoverable credential
      # USER_VERIFICATION: preferred
      # ATTESTATION: none                          # "direct" requests attestation; trust requires separate validation

      # Mount certs and set both to serve over HTTPS (needed to test from another
      # device, where http:// is not a secure context):
      # TLS_CERT: /certs/cert.pem
      # TLS_KEY: /certs/key.pem
    # volumes:
    #   - ./certs:/certs:ro
    restart: "no"
